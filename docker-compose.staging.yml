services:
  console_staging_postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      APP_NAME: ""
      APP_ENV: ""
      APP_VERSION: ""
      AUTH_SESSION_COOKIE_NAME: ""
      AUTH_SESSION_COOKIE_PATH: ""
      AUTH_SESSION_COOKIE_SAMESITE: ""
      AUTH_SESSION_COOKIE_SECURE: ""
      AUTH_SESSION_COOKIE_DOMAIN: ""
      AUTH_SESSION_EXPIRE_MINUTES: ""
      BACKEND_API_URL: ""
      DATABASE_URL: ""
      N8N_TEST_CALLBACK_SECRET: ""
      N8N_TEST_REQUEST_TIMEOUT_SECONDS: ""
      N8N_TEST_WEBHOOK_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      OWNER_PASSWORD: ""
      OWNER_USERNAME: ""
    volumes:
      - console_staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - barong-ops-console-staging

  console_staging_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      BACKEND_API_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      POSTGRES_DB: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: ""
      I_IMAGE_MEDIA_STORAGE_DIR: "/var/lib/barong/i-media"
      K_PRODUCT_MEDIA_STORAGE_DIR: "/var/lib/barong/k-media"
    volumes:
      - console_staging_i_media_data:/var/lib/barong/i-media
      - console_staging_k_media_data:/var/lib/barong/k-media
    depends_on:
      console_staging_postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8000"
    networks:
      - barong-ops-console-staging

  r-w-staging-worker:
    container_name: r-w-staging-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
    command:
      - python
      - -m
      - r_system_v2.rw.workers.worker_runtime
      - rw
    depends_on:
      console_staging_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-staging

  console_staging_frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      APP_NAME: ""
      APP_ENV: ""
      APP_VERSION: ""
      AUTH_SESSION_COOKIE_NAME: ""
      AUTH_SESSION_COOKIE_PATH: ""
      AUTH_SESSION_COOKIE_SAMESITE: ""
      AUTH_SESSION_COOKIE_SECURE: ""
      AUTH_SESSION_COOKIE_DOMAIN: ""
      AUTH_SESSION_EXPIRE_MINUTES: ""
      DATABASE_URL: ""
      N8N_TEST_CALLBACK_SECRET: ""
      N8N_TEST_REQUEST_TIMEOUT_SECONDS: ""
      N8N_TEST_WEBHOOK_URL: ""
      OWNER_PASSWORD: ""
      OWNER_USERNAME: ""
      POSTGRES_DB: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: ""
    depends_on:
      console_staging_backend:
        condition: service_started
    ports:
      - "127.0.0.1:3100:3000"
    networks:
      - barong-ops-console-staging

networks:
  barong-ops-console-staging:
    name: barong-ops-console-staging

volumes:
  console_staging_postgres_data:
    name: console_staging_postgres_data
  console_staging_i_media_data:
    name: console_staging_i_media_data
  console_staging_k_media_data:
    name: console_staging_k_media_data
