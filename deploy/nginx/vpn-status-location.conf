# Exact, read-only VPN status route. The gateway revalidates the normal Barong
# session cookie against the existing backend before returning allowlisted awg0
# aggregate status. It does not apply organization, role, or module permissions.
location = /api/backend/vpn/status {
    limit_except GET HEAD { deny all; }

    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Session-Token "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header Server;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_buffering off;
    proxy_cache off;
}
