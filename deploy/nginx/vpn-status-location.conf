# Exact VPN routes. The gateway revalidates the normal Barong session cookie
# against the existing backend. It applies no organization, role, or module
# permission checks, but scopes every device operation to the signed-in user.
location = /_barong_vpn_release_auth {
    internal;
    proxy_pass http://127.0.0.1:18766/api/backend/vpn/status;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Session-Token "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
}

# The Windows console installer lives under /api/backend so the browser sends
# the session cookie (its path is /api/backend); the old /downloads path never
# received the cookie and always answered 401.
location = /api/backend/vpn/downloads/windows {
    limit_except GET HEAD { deny all; }
    auth_request /_barong_vpn_release_auth;
    alias /opt/barong-ops-console/releases/windows/BarongOpsConsoleSetup-0.3.1-pilot-x64.exe;
    default_type application/vnd.microsoft.portable-executable;
    add_header Cache-Control "private, no-store" always;
    add_header Content-Disposition 'attachment; filename="BarongOpsConsoleSetup-0.3.1-pilot-x64.exe"' always;
    add_header X-Content-Type-Options nosniff always;
}

# Retired path: the session cookie cannot reach it. Fail closed instead of 401.
location = /downloads/BarongOpsConsoleSetup-0.2.2-pilot-x64.exe {
    access_log off;
    return 404;
}

location = /api/backend/vpn/status {
    limit_except GET HEAD { deny all; }

    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Session-Token "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header Server;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_buffering off;
    proxy_cache off;
}

# Node registry: every node the gateway manages, with live status.
location = /api/backend/vpn/nodes {
    limit_except GET HEAD { deny all; }

    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Session-Token "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header Server;
    proxy_connect_timeout 1s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_buffering off;
    proxy_cache off;
}

# Android console app installer, same cookie-scoped auth_request as Windows.
location = /api/backend/vpn/downloads/android {
    limit_except GET HEAD { deny all; }
    auth_request /_barong_vpn_release_auth;
    alias /opt/barong-ops-console/releases/android/BarongOpsConsole-0.3.0-pilot.apk;
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "private, no-store" always;
    add_header Content-Disposition 'attachment; filename="BarongOpsConsole-0.3.0-pilot.apk"' always;
    add_header X-Content-Type-Options nosniff always;
}

# Devices are read-only here: they are only ever created by a signed-in
# client enrolling itself (POST /devices/enroll), never by hand.
location = /api/backend/vpn/devices {
    limit_except GET HEAD { deny all; }

    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Session-Token "";
    proxy_set_header X-Barong-User-ID "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header Server;
    proxy_connect_timeout 1s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_buffering off;
    proxy_cache off;
}

# Native console apps enroll with a locally generated public key. The normal
# Barong session binds the device to the signed-in user; caller-supplied owner
# and authorization headers are always stripped.
location = /api/backend/vpn/devices/enroll {
    client_max_body_size 16k;
    limit_except POST { deny all; }

    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Session-Token "";
    proxy_set_header X-Barong-User-ID "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header Server;
    proxy_connect_timeout 1s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_buffering off;
    proxy_cache off;
}

location ~ "^/api/backend/vpn/devices/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
    client_max_body_size 16k;
    limit_except PATCH { deny all; }

    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Session-Token "";
    proxy_set_header X-Barong-User-ID "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header Server;
    proxy_connect_timeout 1s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_buffering off;
    proxy_cache off;
}
