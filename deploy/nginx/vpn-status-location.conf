# Exact VPN routes. The gateway revalidates the normal Barong session cookie
# against the existing backend. It applies no organization, role, or module
# permission checks, but scopes every device operation to the signed-in user.
location = /api/backend/vpn/status {
    limit_except GET HEAD { deny all; }

    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Session-Token "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header Server;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_buffering off;
    proxy_cache off;
}

location = /api/backend/vpn/devices {
    client_max_body_size 16k;
    limit_except GET POST { deny all; }

    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Session-Token "";
    proxy_set_header X-Barong-User-ID "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header Server;
    proxy_connect_timeout 1s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_buffering off;
    proxy_cache off;
}

location ~ "^/api/backend/vpn/devices/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
    client_max_body_size 16k;
    limit_except PATCH { deny all; }

    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Session-Token "";
    proxy_set_header X-Barong-User-ID "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header Server;
    proxy_connect_timeout 1s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_buffering off;
    proxy_cache off;
}
