# RD 系列 · 远程桌面。由线上 vhost 用 include 引入,和 vpn-status-location.conf 同路子。
#
# 只有一个 location:信令 SSE。其余 /api/backend/rd/* 走默认的 location / 转 Next.js
# 就行,不需要特殊处理。
#
# 这条**必须**关缓冲。流里的轮询在会话建连时会加速到 400ms,nginx 一缓冲就等于把
# WebRTC 的 offer/answer/ice 全攒着不发——不是慢一点的问题,是握手根本完不成。
location = /api/backend/rd/stream {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    # 后端 55 秒主动关流让客户端复验会话,读超时要留出富余
    proxy_read_timeout 90s;
}
