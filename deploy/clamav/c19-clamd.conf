# C19 asset scanner policy for the official ClamAV container. This file is
# mounted read-only over /etc/clamav/clamd.conf; it exposes clamd only on the
# internal Docker network and accepts the Stage 4 compiled 64 MiB hard ceiling.

Foreground yes
User clamav
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav

TCPSocket 3310
TCPAddr 0.0.0.0
# The official clamav/clamav init process waits for one of its standard Unix
# sockets before declaring startup complete. Keep the private TCP listener for
# the Asset worker and this local socket for the container watchdog.
LocalSocket /run/clamav/clamd.sock
MaxConnectionQueueLength 20
MaxThreads 4
ReadTimeout 900
CommandReadTimeout 30
SendBufTimeout 500
IdleTimeout 30

StreamMaxLength 256M
MaxFileSize 256M
MaxScanSize 1024M
MaxRecursion 16
MaxFiles 2000
MaxScanTime 600000
AlertExceedsMax yes

SelfCheck 600
ConcurrentDatabaseReload no
ExitOnOOM yes
Bytecode yes
BytecodeSecurity TrustSigned
