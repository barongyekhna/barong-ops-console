services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: barong_test_example
      POSTGRES_USER: barong_test_example
      POSTGRES_PASSWORD: barong_test_example
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      default:
        aliases:
          - db
          - postgres

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: barong-ops-console-backend
      APP_ENV: development
      APP_VERSION: 0.1.0
      AUTH_SESSION_COOKIE_PATH: ${AUTH_SESSION_COOKIE_PATH:-/api/backend}
      AUTH_SESSION_COOKIE_SAMESITE: ${AUTH_SESSION_COOKIE_SAMESITE:-lax}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:-false}
      AUTH_SESSION_COOKIE_DOMAIN: ${AUTH_SESSION_COOKIE_DOMAIN:-}
      AUTH_SESSION_EXPIRE_MINUTES: ${AUTH_SESSION_EXPIRE_MINUTES:-60}
      DATABASE_URL: postgresql+psycopg://barong_test_example:barong_test_example@db:5432/barong_test_example
      UVICORN_WORKERS: ${UVICORN_WORKERS:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-30}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-70}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1200}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-8000}
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS:-10000}
      N8N_TEST_CALLBACK_SECRET: ${N8N_TEST_CALLBACK_SECRET:-}
      N8N_TEST_REQUEST_TIMEOUT_SECONDS: ${N8N_TEST_REQUEST_TIMEOUT_SECONDS:-10}
      N8N_TEST_WEBHOOK_URL: ${N8N_TEST_WEBHOOK_URL:-}
      WEBHOOK_GATEWAY_SIGNING_SECRET: ${WEBHOOK_GATEWAY_SIGNING_SECRET:-}
      WEBHOOK_REPLAY_NONCE_TTL_SECONDS: ${WEBHOOK_REPLAY_NONCE_TTL_SECONDS:-900}
      CONTROL_PLANE_STEALTH_MODE: ${CONTROL_PLANE_STEALTH_MODE:-false}
      LOGIN_IP_RATE_LIMIT_ATTEMPTS: ${LOGIN_IP_RATE_LIMIT_ATTEMPTS:-20}
      LOGIN_USER_RATE_LIMIT_ATTEMPTS: ${LOGIN_USER_RATE_LIMIT_ATTEMPTS:-10}
      LOGIN_ENDPOINT_RATE_LIMIT_ATTEMPTS: ${LOGIN_ENDPOINT_RATE_LIMIT_ATTEMPTS:-200}
      LOGIN_IP_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_IP_RATE_LIMIT_WINDOW_SECONDS:-900}
      K_PRODUCT_MEDIA_STORAGE_DIR: /var/lib/barong/k-media
    volumes:
      - k_media_data:/var/lib/barong/k-media
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_API_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  k_media_data:
