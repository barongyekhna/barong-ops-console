services:
  console_postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_NAME: ""
      APP_ENV: ""
      APP_VERSION: ""
      AUTH_SESSION_COOKIE_NAME: ""
      AUTH_SESSION_COOKIE_PATH: ""
      AUTH_SESSION_COOKIE_SAMESITE: ""
      AUTH_SESSION_COOKIE_SECURE: ""
      AUTH_SESSION_COOKIE_DOMAIN: ""
      AUTH_SESSION_EXPIRE_MINUTES: ""
      BACKEND_API_URL: ""
      DATABASE_URL: ""
      N8N_TEST_CALLBACK_SECRET: ""
      N8N_TEST_REQUEST_TIMEOUT_SECONDS: ""
      N8N_TEST_WEBHOOK_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      OWNER_PASSWORD: ""
      OWNER_USERNAME: ""
    volumes:
      - console_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - barong-ops-console-prod

  console_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      BACKEND_API_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      POSTGRES_DB: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: ""
      GUNICORN_WORKERS: "3"
      GUNICORN_TIMEOUT: "180"
      GUNICORN_GRACEFUL_TIMEOUT: "30"
      N8N_P_UPLOAD_WEBHOOK: "https://n8n.barongyekhna.com/webhook/barong-p-upload"
      P_CALLBACK_BASE: "http://console_backend:8000"
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      I_IMAGE_MEDIA_STORAGE_DIR: "/var/lib/barong/i-media"
      K_PRODUCT_MEDIA_STORAGE_DIR: "/var/lib/barong/k-media"
      RW_DEEPSEEK_MODEL: "deepseek-v4-pro"
      DEEPSEEK_MODEL: "deepseek-v4-pro"
    volumes:
      - console_i_media_data:/var/lib/barong/i-media
      - console_k_media_data:/var/lib/barong/k-media
    depends_on:
      console_postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - barong-ops-console-prod

  r-w-worker:
    container_name: r-w-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      RA_AUTO_PROFIT_JOB_ASIN_LIMIT: "20"
      RW_DEEPSEEK_MODEL: "deepseek-v4-pro"
      DEEPSEEK_MODEL: "deepseek-v4-pro"
      RW_KEEPA_MAX_DISCOVERY_REQUESTS_PER_CYCLE: "3"
      RW_KEEPA_DISCOVERY_REQUEST_INTERVAL_SECONDS: "3"
    command:
      - python
      - -m
      - r_system_v2.rw.workers.worker_runtime
      - rw
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  r-a-worker:
    container_name: r-a-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      RA_WORKER_PRODUCT_CONCURRENCY: "6"
      RA_AUTO_PROFIT_JOB_ASIN_LIMIT: "20"
    command:
      - python
      - -m
      - r_system_v2.rw.workers.worker_runtime
      - ra
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  k-worker:
    container_name: k-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "12"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      K_GENERATION_CONCURRENCY: "5"
      K_GENERATION_POLL_SECONDS: "3"
    command:
      - python
      - -m
      - backend.app.modules.k_series.product_knowledge.worker_main
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  console_frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_NAME: ""
      APP_ENV: ""
      APP_VERSION: ""
      AUTH_SESSION_COOKIE_NAME: ""
      AUTH_SESSION_COOKIE_PATH: ""
      AUTH_SESSION_COOKIE_SAMESITE: ""
      AUTH_SESSION_COOKIE_SECURE: ""
      AUTH_SESSION_COOKIE_DOMAIN: ""
      AUTH_SESSION_EXPIRE_MINUTES: ""
      DATABASE_URL: ""
      N8N_TEST_CALLBACK_SECRET: ""
      N8N_TEST_REQUEST_TIMEOUT_SECONDS: ""
      N8N_TEST_WEBHOOK_URL: ""
      OWNER_PASSWORD: ""
      OWNER_USERNAME: ""
      POSTGRES_DB: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: ""
    depends_on:
      console_backend:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - barong-ops-console-prod

networks:
  barong-ops-console-prod:
    name: barong-ops-console-prod

volumes:
  console_postgres_data:
    name: console_postgres_data
  console_i_media_data:
    name: console_i_media_data
  console_k_media_data:
    name: console_k_media_data
