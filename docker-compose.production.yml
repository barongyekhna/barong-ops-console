services:
  console_postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_NAME: ""
      APP_ENV: ""
      APP_VERSION: ""
      AUTH_SESSION_COOKIE_NAME: ""
      AUTH_SESSION_COOKIE_PATH: ""
      AUTH_SESSION_COOKIE_SAMESITE: ""
      AUTH_SESSION_COOKIE_SECURE: ""
      AUTH_SESSION_COOKIE_DOMAIN: ""
      AUTH_SESSION_EXPIRE_MINUTES: ""
      BACKEND_API_URL: ""
      DATABASE_URL: ""
      C19_RECORD_STORE_URL: ""
      C19_RECORD_STORE_TOKEN: ""
      C19_RECORD_STORE_TIMEOUT_SECONDS: ""
      C19_RECORD_EVENT_POLL_SECONDS: ""
      C19_EVENT_STREAM_LIFETIME_SECONDS: ""
      C19_ASSET_STORE_URL: ""
      C19_ASSET_STORE_TOKEN: ""
      C19_ASSET_STORE_TIMEOUT_SECONDS: ""
      N8N_TEST_CALLBACK_SECRET: ""
      N8N_TEST_REQUEST_TIMEOUT_SECONDS: ""
      N8N_TEST_WEBHOOK_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      OWNER_PASSWORD: ""
      OWNER_USERNAME: ""
    volumes:
      - console_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - barong-ops-console-prod

  console_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      BACKEND_API_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      POSTGRES_DB: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: ""
      GUNICORN_WORKERS: "5"
      GUNICORN_TIMEOUT: "180"
      GUNICORN_GRACEFUL_TIMEOUT: "30"
      N8N_P_UPLOAD_WEBHOOK: "https://n8n.barongyekhna.com/webhook/barong-p-upload"
      N8N_GEO_PUBLISH_WEBHOOK: "https://n8n.barongyekhna.com/webhook/barong-geo-publish"
      N8N_SEO_PUBLISH_WEBHOOK: "https://n8n.barongyekhna.com/webhook/barong-seo-publish"
      N8N_GEO_BACKLINK_WEBHOOK: "https://n8n.barongyekhna.com/webhook/barong-geo-backlink"
      N8N_B2B_WIDGET_WEBHOOK: "https://n8n.barongyekhna.com/webhook/barong-b2b-widget"
      # W-S 物流：模板/单号同步派单 + 订单 ingest 鉴权（n8n 侧工作流用同一 token）
      N8N_W_SYNC_WEBHOOK: "https://n8n.barongyekhna.com/webhook/barong-w-shipping"
      W_ORDERS_INGEST_TOKEN: "XDDlIDdhCupSE3Fs2Bkd9tYC6Pg-YbkyuI8f7NQRsiY"
      # 独立站流量采集（barongWtraffic001 → /w/traffic/ingest）。独立一把钥匙，绝不复用上面那把。
      W_TRAFFIC_INGEST_TOKEN: "tPkAivSN0vac3yXG3FluYdcxle6WOnXpm7SvBr7Xgng"
      P_CALLBACK_BASE: "http://console_backend:8000"
      W_CALLBACK_BASE: "http://console_backend:8000"
      # H-S 站点健康：巡检派单 webhook + 回传 ingest 鉴权（n8n 侧同一 token）
      N8N_H_HEALTH_WEBHOOK: "https://n8n.barongyekhna.com/webhook/barong-h-sitehealth"
      H_INGEST_TOKEN: "fzL94VyhMsEyYNlQqLYy0nXMYBeqm1KRgTC-xYlK3HA"
      H_CALLBACK_BASE: "http://console_backend:8000"
      # B2B 批发页每日重发（n8n barongB2Brepublish001 用同一个 token）。
      # 作用：把用户在 WP 里手动发布的新指南捞上批发页——控制台不知道那个
      # 动作何时发生，只能定期回去核一遍。没配这个值端点就一律 403。
      B2B_REPUBLISH_TOKEN: "SBTs5846I6NVLjpmLTjDC_ChepxGDr2rjFZEwj6nZTc"
      # 内链网每日兜底(n8n 03:20 打)。**必须与 B2B_REPUBLISH_TOKEN 不同值**——
      # 两条流打两扇门，一把钥匙开两把锁等于没锁。
      CONTENT_LINKS_TOKEN: "ke_YJmVZ5SFg-K1PG7QXrathZ3yIqbV1AgOBV5kL4NU"
      # Google Ads gate 状态与额度显示要和 r-a-worker 一致（设置页/额度页读这里）。
      RA_GOOGLE_ADS_BASIC_REVIEW_STATUS: "approved"
      RA_GOOGLE_ADS_ENABLE_REAL_CALLS: "true"
      RA_GOOGLE_ADS_PLANNER_DAILY_BUDGET: "13500"
      # deepseek-v4-pro 响应常超默认 12s；F 找货的中文采购词提取给足 60s
      RA_DEEPSEEK_KEYWORD_TIMEOUT_SECONDS: "60"
      # F 系列 1688 独立总闸：全量 10 万/天里 R-A 占 9 万，剩 1 万归 F 批量找货
      F_1688_APP_CALLS_DAILY_BUDGET: "10000"
      # F 图搜接力：serper 种子图 → CPS 分销大池（50万次/6mo credit 池）。
      # 图搜不设日闸（F 低频，只记数）；守门靠"每产品凑够 10 家即停"。
      F_1688_IMAGE_SEARCH_DAILY_BUDGET: "0"
      F_IMAGES_PER_PRODUCT: "30"
      F_CANDIDATES_PER_PRODUCT: "10"
      # F 候选图片代理缓存（绕 alicdn 防盗链 + 提速）
      F_IMAGE_CACHE_DIR: "/var/lib/barong/f-media"
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      I_IMAGE_MEDIA_STORAGE_DIR: "/var/lib/barong/i-media"
      K_PRODUCT_MEDIA_STORAGE_DIR: "/var/lib/barong/k-media"
      RW_DEEPSEEK_MODEL: "deepseek-v4-pro"
      DEEPSEEK_MODEL: "deepseek-v4-pro"
    volumes:
      - console_i_media_data:/var/lib/barong/i-media
      - console_k_media_data:/var/lib/barong/k-media
      - console_f_media_data:/var/lib/barong/f-media
    depends_on:
      console_postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - barong-ops-console-prod

  r-w-worker:
    container_name: r-w-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      C19_RECORD_STORE_URL: ""
      C19_RECORD_STORE_TOKEN: ""
      C19_RECORD_STORE_TIMEOUT_SECONDS: ""
      C19_RECORD_EVENT_POLL_SECONDS: ""
      C19_EVENT_STREAM_LIFETIME_SECONDS: ""
      C19_ASSET_STORE_URL: ""
      C19_ASSET_STORE_TOKEN: ""
      C19_ASSET_STORE_TIMEOUT_SECONDS: ""
      RA_AUTO_PROFIT_JOB_ASIN_LIMIT: "20"
      RW_DEEPSEEK_MODEL: "deepseek-v4-pro"
      DEEPSEEK_MODEL: "deepseek-v4-pro"
      RW_KEEPA_MAX_DISCOVERY_REQUESTS_PER_CYCLE: "3"
      RW_KEEPA_DISCOVERY_REQUEST_INTERVAL_SECONDS: "3"
    command:
      - python
      - -m
      - r_system_v2.rw.workers.worker_runtime
      - rw
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  r-a-worker:
    container_name: r-a-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    # CPU 软限制：机器空闲时照样全速，但控制台(backend/前端)要 CPU 时优先让路。
    # 火力全开不牺牲吞吐，只治「巡库全速时后台操作卡」。
    cpu_shares: 512
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      C19_RECORD_STORE_URL: ""
      C19_RECORD_STORE_TOKEN: ""
      C19_RECORD_STORE_TIMEOUT_SECONDS: ""
      C19_RECORD_EVENT_POLL_SECONDS: ""
      C19_EVENT_STREAM_LIFETIME_SECONDS: ""
      C19_ASSET_STORE_URL: ""
      C19_ASSET_STORE_TOKEN: ""
      C19_ASSET_STORE_TIMEOUT_SECONDS: ""
      # 4 核主机上 6 并发会挤压 API 响应，3 并发是吞吐/负载平衡点。
      RA_WORKER_PRODUCT_CONCURRENCY: "3"
      RA_AUTO_PROFIT_JOB_ASIN_LIMIT: "20"
      # 2026-07-10 影子模式实测误杀率 0%（199 个样本，cut 10 个无一利润通过），切 enforce。
      RA_PRESCREEN_MODE: "enforce"
      # 词搜优先策略：免费词搜+AI 看图确认同款/同类，词搜无果才花图搜额度。
      RA_1688_SEARCH_STRATEGY: "keyword_first"
      # AI 看图模型（走 4sapi「I 系列企业分组备用key」）；节日品只认 same_product。
      RA_VISION_MODEL: "gpt-4o-mini"
      # R-A 全部 DeepSeek 调用切 flash（2026-09-07 用户拍板：同通道 pro 19.5s / flash 6.3s）。
      RA_DEEPSEEK_MODEL: "deepseek-v4-flash"
      # 抽词是「整份 skill 文档当 system prompt + 严格 JSON」，2026-09-07 北京时间中午
      # 实测 flash 也要 30-45s；代码默认 12s 把三个产品全判成超时顺延。抽词放到 60s
      # （与 F 找货一致），供应商比对 30s（代码上限）。
      RA_DEEPSEEK_KEYWORD_TIMEOUT_SECONDS: "60"
      RA_DEEPSEEK_MATCH_TIMEOUT_SECONDS: "30"
      # 图搜通道：跨境包（≈5000 次一次性套餐）2026-07-24 打光，09-05 起远端只回
      # NoUsageLeft，用户拍板不续 → 只走分销包。要临时切回双通道改成 "cps,cross"。
      RA_1688_IMAGE_CHANNELS: "cps"
      # 分销包（50 万次/至 2027-01-17）日额度不再写死：按「包剩余 ÷ 剩余天数 × 0.9」
      # 每天推算（quota_ledger.cps_package_summary）。显式设 RA_1688_CPS_IMAGE_SEARCH_DAILY_BUDGET
      # 会压住动态值，所以这里不设。跨境通道额度只在通道列表含 cross 时才生效。
      RA_1688_IMAGE_SEARCH_DAILY_BUDGET: "330"
      RA_1688_CPS_PACKAGE_TOTAL: "500000"
      RA_1688_CPS_PACKAGE_EXPIRES_ON: "2027-01-17"
      # 1688 应用总调用闸：2026-07-11 发布审核通过，正式额度 10 万/天（留余 10% 防撞顶）。
      RA_1688_APP_CALLS_DAILY_BUDGET: "90000"
      # Google Ads Keyword Planner：2026-07-14 Basic 过审（15000 ops/天，留余 10%）。
      RA_GOOGLE_ADS_BASIC_REVIEW_STATUS: "approved"
      RA_GOOGLE_ADS_ENABLE_REAL_CALLS: "true"
      RA_GOOGLE_ADS_PLANNER_DAILY_BUDGET: "13500"
    command:
      - python
      - -m
      - r_system_v2.rw.workers.worker_runtime
      - ra
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  k-worker:
    container_name: k-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "12"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      C19_RECORD_STORE_URL: ""
      C19_RECORD_STORE_TOKEN: ""
      C19_RECORD_STORE_TIMEOUT_SECONDS: ""
      C19_RECORD_EVENT_POLL_SECONDS: ""
      C19_EVENT_STREAM_LIFETIME_SECONDS: ""
      C19_ASSET_STORE_URL: ""
      C19_ASSET_STORE_TOKEN: ""
      C19_ASSET_STORE_TIMEOUT_SECONDS: ""
      K_GENERATION_CONCURRENCY: "5"
      K_GENERATION_POLL_SECONDS: "3"
      K_IMAGE_RENDER_CONCURRENCY: "3"
      K_IMAGE_RENDER_POLL_SECONDS: "3"
    volumes:
      - console_k_media_data:/var/lib/barong/k-media
    command:
      - python
      - -m
      - backend.app.modules.k_series.product_knowledge.worker_main
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  k-mcp:
    # K 外部精修通道:给 Codex 桌面版等外部代理的 MCP 服务(取简报/参考图,交稿只落 staged)。
    # 独立镜像(多装 mcp SDK),只在 127.0.0.1:8095 监听,由 nginx location /mcp/k-images 直达。
    container_name: k-mcp
    build:
      context: .
      dockerfile: backend/Dockerfile.k-mcp
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "4"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      C19_RECORD_STORE_URL: ""
      C19_RECORD_STORE_TOKEN: ""
      C19_RECORD_STORE_TIMEOUT_SECONDS: ""
      C19_RECORD_EVENT_POLL_SECONDS: ""
      C19_EVENT_STREAM_LIFETIME_SECONDS: ""
      C19_ASSET_STORE_URL: ""
      C19_ASSET_STORE_TOKEN: ""
      C19_ASSET_STORE_TIMEOUT_SECONDS: ""
      K_MCP_PORT: "8095"
    volumes:
      - console_k_media_data:/var/lib/barong/k-media
    ports:
      - "127.0.0.1:8095:8095"
    command:
      - python
      - -m
      - backend.app.mcp
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  geo-worker:
    container_name: geo-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "4"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      GEO_GENERATION_CONCURRENCY: "2"
      GEO_GENERATION_POLL_SECONDS: "3"
    command:
      - python
      - -m
      - backend.app.modules.geo_series.content.worker_main
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  seo-worker:
    container_name: seo-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "4"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      SEO_GENERATION_CONCURRENCY: "2"
      SEO_GENERATION_POLL_SECONDS: "3"
    command:
      - python
      - -m
      - backend.app.modules.seo_series.content.worker_main
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  # SM 系列 · 社媒运营 worker:排 28 天日历 / 写帖子 / 扫缺口单。
  # mock 期一条都不外发;心跳记在 worker_heartbeats(sm-worker),验收只认那个时间戳。
  sm-worker:
    container_name: sm-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "4"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      SM_WRITER_CONCURRENCY: "1"
      SM_WORKER_POLL_SECONDS: "5"
    command:
      - python
      - -m
      - backend.app.modules.sm_series.worker_main
    volumes:
      - console_k_media_data:/var/lib/barong/k-media
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  # 数字员工 01 · 白苏婉(内容专员)。见 docs/AGENT_BAISUWAN_V1.md。
  # 她只读:权限只有 geo.content.read / seo.content.read,而且 console_client
  # 里根本没实现写端点。刻意不 depends_on console_backend —— 后端重启期间
  # 她自己退避重试就行,不该被一起拽下线。
  baisuwan-worker:
    container_name: baisuwan-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "2"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      AGENT_MEMORY_DIR: "/var/lib/barong/agent-memory"
      AGENT_CONSOLE_BASE_URL: "http://console_backend:8000"
      AGENT_CHAT_POLL_SECONDS: "3"
      # 聊天窗里等 240 秒(路由器默认)等于死机。
      AGENT_DEEPSEEK_TIMEOUT_SECONDS: "60"
      # 主动巡检:出事就说,但一天最多一条、同一件事永不重提(规矩在 patrol.py)。
      AGENT_PATROL_ENABLED: "1"
      AGENT_PATROL_SECONDS: "600"
      AGENT_REPORT_TO_USER_ID: "1"
      AGENT_STALE_DAYS: "5"
    volumes:
      - console_agent_memory_data:/var/lib/barong/agent-memory
    command:
      - python
      - -m
      - backend.app.modules.agent_series.baisuwan.worker_main
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  # 数字员工 02 · 霓旌(制造公司库管员)。见 docs/AGENT_NIJING_V1.md。
  # 她自己零权限:对 M 系列库存的每一步都在进程内以说话人的身份过角色门;
  # C19 只用来听和说。每一笔写入先出确认卡。不巡检、不主动开口。
  nijing-worker:
    container_name: nijing-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "2"
      DB_POOL_RECYCLE_SECONDS: "600"
      DB_STATEMENT_TIMEOUT_MS: "8000"
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "8000"
      AGENT_MEMORY_DIR: "/var/lib/barong/agent-memory"
      AGENT_CONSOLE_BASE_URL: "http://console_backend:8000"
      AGENT_CHAT_POLL_SECONDS: "3"
      # 她只做意图抽取,30 秒等不到就回「没接通,什么都没做」。
      NIJING_AI_TIMEOUT_SECONDS: "30"
    volumes:
      - console_agent_memory_data:/var/lib/barong/agent-memory
    command:
      - python
      - -m
      - backend.app.modules.agent_series.nijing.worker_main
    depends_on:
      console_postgres:
        condition: service_healthy
    networks:
      - barong-ops-console-prod

  key-health-worker:
    container_name: key-health-worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GUNICORN_WORKERS: ""
      GUNICORN_TIMEOUT: ""
      GUNICORN_GRACEFUL_TIMEOUT: ""
      DB_POOL_SIZE: "2"
