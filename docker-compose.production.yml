services:
  console_postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_NAME: ""
      APP_ENV: ""
      APP_VERSION: ""
      AUTH_SESSION_COOKIE_NAME: ""
      AUTH_SESSION_COOKIE_PATH: ""
      AUTH_SESSION_COOKIE_SAMESITE: ""
      AUTH_SESSION_COOKIE_SECURE: ""
      AUTH_SESSION_COOKIE_DOMAIN: ""
      AUTH_SESSION_EXPIRE_MINUTES: ""
      BACKEND_API_URL: ""
      DATABASE_URL: ""
      N8N_TEST_CALLBACK_SECRET: ""
      N8N_TEST_REQUEST_TIMEOUT_SECONDS: ""
      N8N_TEST_WEBHOOK_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      OWNER_PASSWORD: ""
      OWNER_USERNAME: ""
    volumes:
      - console_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - barong-ops-console-prod

  console_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      BACKEND_API_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
      POSTGRES_DB: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: ""
    depends_on:
      console_postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - barong-ops-console-prod

  console_frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_NAME: ""
      APP_ENV: ""
      APP_VERSION: ""
      AUTH_SESSION_COOKIE_NAME: ""
      AUTH_SESSION_COOKIE_PATH: ""
      AUTH_SESSION_COOKIE_SAMESITE: ""
      AUTH_SESSION_COOKIE_SECURE: ""
      AUTH_SESSION_COOKIE_DOMAIN: ""
      AUTH_SESSION_EXPIRE_MINUTES: ""
      DATABASE_URL: ""
      N8N_TEST_CALLBACK_SECRET: ""
      N8N_TEST_REQUEST_TIMEOUT_SECONDS: ""
      N8N_TEST_WEBHOOK_URL: ""
      OWNER_PASSWORD: ""
      OWNER_USERNAME: ""
      POSTGRES_DB: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: ""
    depends_on:
      console_backend:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - barong-ops-console-prod

networks:
  barong-ops-console-prod:
    name: barong-ops-console-prod

volumes:
  console_postgres_data:
    name: console_postgres_data
