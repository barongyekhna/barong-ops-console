<?xml version="1.0" encoding="UTF-8"?>
<!-- 单色可染凤凰，fill="currentColor" 配合 CSS mask image 使用。
     background color 决定颜色，跟着 color phoenix 令牌走三套皮肤。
     现有的 barong-phoenix.svg 是多色的（白/铜橙/淡蓝），换皮肤时染不了色，
     所以这里另画一份，取自已批准的主题静态样片。
     XML 注释内不能出现连字符相连（会被当成合法性错误），上面这段特意
     不用双连字符/CSS 变量名里的双横线写法。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <path fill="currentColor" d="M58.5 14.5c6.6-3.4 12.6-.6 11.8 5.6-.7 5.2-6.4 7.4-11.6 8.2-4.9 6.6-7.7 13.4-8.2 21.2l-1.6 15.3c-3.1-8.1-4.3-17.6-2.6-26 1.9-9.6 6.2-18.6 12.2-24.3z"/>
  <path fill="currentColor" d="M46.4 40.2C35.6 30 22.4 22.8 8.2 19.6c5.9 11.1 13.6 20.2 22.9 27.4-7-1-13.9-3.1-20.1-6.2 8.1 11.4 20.4 19.4 34.6 22.6l2.4-8.7z"/>
  <path fill="currentColor" d="M53.2 39.8C64.3 28.6 78.4 21.2 93.4 18c-5.9 11.6-14.2 21.1-24 28.4 7.3-1 14.4-3.1 20.9-6.2-8.4 11.9-21.2 20.1-36 23.2l-3.4-8.9z"/>
  <path fill="currentColor" d="M46.8 65.2c-4.6 11.2-11.6 21.6-20.5 30.6 8.7-4.2 15.9-11 21.2-19.8-.6 7.6-1.8 15-3.6 22.2 5.6-8.6 8.9-18.4 9.6-28.8l-6.7-4.2z"/>
  <path fill="currentColor" d="M55.6 66.6c4.8 10.4 11.8 19.8 20.4 27.8-6.8-9.4-11.6-19.6-14.4-30.4l-6 2.6z"/>
</svg>
