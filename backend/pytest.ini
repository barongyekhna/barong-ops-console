[pytest]
testpaths = tests/backend
markers =
    unit: backend unit tests that do not require a live database service
    integration: backend tests that require an Alembic-managed isolated test database
    system: broader system or legacy DB tests that are not part of unit/integration CI lanes
    slow: tests that are expected to take materially longer than the default suite
    k_mcp: K external image channel (MCP) tests; select with -m "integration and k_mcp"
